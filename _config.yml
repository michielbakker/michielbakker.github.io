source:      .
destination: ./_site
includes:    ./_includes
baseurl: ""
google_analytics: G-PEJ2CJBMYP
url: "https://miba.dev"

collections:
  projects:
    # Inherited from the template these pages came with; they describe
    # someone else's projects, so they are not published.
    output: false

plugins:
  - jekyll-sitemap

defaults:
  # Unlinked leftover PDFs from the template; don't advertise them.
  - scope:
      path: "assets"
    values:
      sitemap: false
