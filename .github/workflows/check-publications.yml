# Compares _data/publications.yaml against arXiv and Crossref and reports
# entries that disagree with their source of record.
#
# This exists because a batch of entries once went live with invented author
# given names (real surnames, wrong first names) and stayed up for months --
# the kind of error that is invisible on the page but obvious against the API.
#
# The full report always lands in the run's job summary. Issues are currently
# disabled on this repository, so the run is failed to raise the alarm (GitHub
# emails the owner on a failed scheduled run). If Issues are ever enabled, the
# report step files and updates a single issue instead, and stops failing.
name: Check publications for drift

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      skip_links:
        description: "Skip link resolution (faster)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: check-publications
  cancel-in-progress: true

env:
  ISSUE_TITLE: "Publication metadata drift"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Check publications
        id: check
        run: |
          ARGS=""
          if [ "${{ inputs.skip_links }}" = "true" ]; then ARGS="--skip-links"; fi
          python scripts/check_publications.py $ARGS | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # the script exits 0 without --strict; decide from the report itself
          if grep -q "^No drift found\." report.md; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report drift
        if: steps.check.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Entries in \`_data/publications.yaml\` disagree with arXiv or"
            echo "Crossref, or their links no longer resolve."
            echo
            cat report.md
            echo
            echo "_From [this run]($RUN_URL)._"
          } > body.md

          if ! gh issue list --state open --limit 1 >/dev/null 2>&1; then
            echo "::error::Publication metadata drift found - see the job summary."
            echo "(Issues are disabled on this repository, so this run is failed instead."
            echo " Enable Issues to have the report filed as one instead of a red X.)"
            exit 1
          fi

          EXISTING=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
                       --json number,title \
                       --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file body.md
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Close the issue when everything is clean
        if: steps.check.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh issue list --state open --limit 1 >/dev/null 2>&1; then
            echo "Issues are disabled on this repository; nothing to close."
            exit 0
          fi
          EXISTING=$(gh issue list --state open --search "$ISSUE_TITLE in:title" \
                       --json number,title \
                       --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "No drift found on the latest run."
          fi
