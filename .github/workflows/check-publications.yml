# Compares _data/publications.yaml against arXiv and Crossref and opens an issue
# when an entry disagrees with its source of record.
#
# This exists because a batch of entries once went live with invented author
# given names (real surnames, wrong first names) and stayed up for months --
# the kind of error that is invisible on the page but obvious against the API.
name: Check publications for drift

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      skip_links:
        description: "Skip link resolution (faster)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: check-publications
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Check publications
        id: check
        run: |
          ARGS=""
          if [ "${{ inputs.skip_links }}" = "true" ]; then ARGS="--skip-links"; fi
          python scripts/check_publications.py $ARGS | tee report.md
          # the script exits 0 without --strict; decide from the report itself
          if grep -q "^No drift found." report.md; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue
        if: steps.check.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Publication metadata drift"
        run: |
          {
            echo "The weekly check found entries in \`_data/publications.yaml\` that"
            echo "disagree with arXiv or Crossref, or whose links no longer resolve."
            echo
            cat report.md
            echo
            echo "_From [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._"
          } > body.md

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title \
                       --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file body.md
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Close the issue when everything is clean
        if: steps.check.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Publication metadata drift"
        run: |
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,title \
                       --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "No drift found on the latest run."
          fi
